# db.properties
# Pine Labs Credit Modernization
# Updated by Pine Labs team on master

# PostgreSQL connection — prod environment
db.url=jdbc:postgresql://prod-db.pinelabs.com:5432/pinelabs
db.driver=org.postgresql.Driver
db.username=pinelabs_prod_user
db.password=${DB_PASSWORD}
db.dialect=org.hibernate.dialect.PostgreSQLDialect

# Standard connection pool settings — Pine Labs team
# CONFLICTS with mod-release which uses HikariCP settings
db.pool.minSize=10
db.pool.maxSize=100
db.pool.timeout=30000
db.pool.idleTimeout=600000
