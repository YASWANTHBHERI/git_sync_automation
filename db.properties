# db.properties
# Pine Labs Credit Modernization
# Updated by MOD team on mod-release — added HikariCP pool settings

# PostgreSQL connection
db.url=jdbc:postgresql://dev-db.pinelabs.com:5432/pinelabs_mod
db.driver=org.postgresql.Driver
db.username=pinelabs_mod_user
db.password=${DB_PASSWORD}
db.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP connection pool — added by MOD team
# This CONFLICTS with master's addition of different pool settings
hikari.pool.minIdle=5
hikari.pool.maxPoolSize=20
hikari.pool.connectionTimeout=20000
hikari.pool.idleTimeout=300000
hikari.pool.maxLifetime=1200000
